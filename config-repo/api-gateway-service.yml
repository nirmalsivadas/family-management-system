spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: family-service
              uri: lb://FAMILY-SERVICE
              predicates:
                - Path=/api/users/**

            - id: family-family-service
              uri: lb://FAMILY-SERVICE
              predicates:
                - Path=/api/family/**

            - id: master-service
              uri: lb://MASTER-SERVICE
              predicates:
                - Path=/api/master/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notification/**

server:
  port: 8080