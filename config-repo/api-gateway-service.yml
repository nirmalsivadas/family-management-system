spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: family-service
              uri: lb://FAMILY-SERVICE
              predicates:
                - Path=/api/users/**

            - id: family-family-service
              uri: lb://FAMILY-SERVICE
              predicates:
                - Path=/api/family/**

            - id: master-service
              uri: lb://MASTER-SERVICE
              predicates:
                - Path=/api/master/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notification/**

server:
  port: 8080