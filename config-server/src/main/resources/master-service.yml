spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/family_management_system_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka

  server:
    port: 8083