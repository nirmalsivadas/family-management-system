spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/nirmalsivadas/family-management-system.git
          default-label: main
          search-paths: config-repo

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
